<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contratación exitosa | Cubri Seguros</title>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/checkout.css">
    <script type="module" src="js/app.js"></script>
</head>
<body data-page="exito">
    <header class="site-header"><div class="header-inner">
        <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">C</span><span>Cubri Seguros</span></a>
        <span class="header-caption">Contratación digital</span>
    </div></header>
    <main class="app-shell">
        <section class="view result-view" aria-labelledby="success-title">
            <div id="page-error" class="notice notice-error" role="alert" hidden></div>
            <div class="result-icon result-icon-success" aria-hidden="true">✓</div>
            <span class="eyebrow">PAGO APROBADO</span>
            <h1 id="success-title" tabindex="-1">¡Felicitaciones, <span id="success-name"></span>!</h1>
            <p>Tu contratación se completó correctamente. Enviaremos el detalle a <strong id="success-email"></strong>.</p>
            <div class="policy-box"><span>NÚMERO DE PÓLIZA</span><strong id="policy-number"></strong></div>
            <div class="result-summary" id="success-summary"></div>
            <button class="btn" type="button" data-reset>Volver al inicio</button>
            <p class="fine-print">Esta contratación es una simulación académica; no representa una póliza real.</p>
        </section>
        <footer class="site-footer"><span>© 2026 Cubri Seguros</span><span>Gracias por confiar en nosotros</span></footer>
    </main>
</body>
</html>
