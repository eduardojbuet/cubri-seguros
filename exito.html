
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contratación exitosa | Cubrí Seguros</title>

    <!-- Tailwind CSS v4 & Basecoat UI -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/basecoat-ui@0.2.1/dist/basecoat.min.css">

    <!-- Estilos propios -->
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body class="pantalla-resultado" data-resultado="exito">

    <main class="contenido-resultado">

        <section class="tarjeta-resultado">

            <div class="icono-resultado exito">
                ✓
            </div>

            <span class="etiqueta-resultado">PAGO APROBADO</span>

            <h1>¡Felicitaciones!</h1>

            <p class="descripcion-resultado">
                Tu contratación se completó correctamente.
                Gracias por confiar en Cubrí Seguros.
            </p>

            <div class="numero-poliza">
                <span>NÚMERO DE PÓLIZA</span>
                <strong id="numero-poliza">Cargando...</strong>
            </div>

            <div class="detalle-resultado">
                <h2>Resumen de tu seguro</h2>
                <p id="resumen-exito">Cargando información...</p>
                <p id="fecha-contratacion"></p>
            </div>

            <a href="index.html" class="boton-principal boton-resultado">
                Volver al inicio
            </a>

            <p class="aclaracion-resultado">
                Esta contratación es una simulación académica.
                No representa una póliza real.
            </p>

        </section>

    </main>

    <script src="js/estado.js"></script>
    <script src="js/resultado.js"></script>

</body>
</html>
