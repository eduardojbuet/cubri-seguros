
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago rechazado | Cubrí Seguros</title>

    <!-- Tailwind CSS v4 & Basecoat UI -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/basecoat-ui@0.2.1/dist/basecoat.min.css">

    <!-- Estilos propios -->
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body class="pantalla-resultado" data-resultado="error">

    <main class="contenido-resultado">

        <section class="tarjeta-resultado">

            <div class="icono-resultado error">
                !
            </div>

            <span class="etiqueta-resultado etiqueta-error">
                PAGO RECHAZADO
            </span>

            <h1>No pudimos procesar tu pago</h1>

            <p class="descripcion-resultado">
                La operación no pudo completarse.
                Revisá los datos de tu tarjeta e intentá nuevamente.
            </p>

            <div class="detalle-resultado">
                <h2>Tu contratación sigue pendiente</h2>
                <p id="resumen-error">
                    Podés volver al formulario de pago e intentarlo nuevamente.
                </p>
            </div>

            <a href="pago.html" class="boton-principal boton-resultado">
                Intentar nuevamente
            </a>

            <a href="titular.html" class="enlace-resultado">
                Volver a mis datos
            </a>

        </section>

    </main>

    <script src="js/estado.js"></script>
    <script src="js/resultado.js"></script>

</body>
</html>
